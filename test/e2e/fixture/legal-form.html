<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Electronic case filing portal for civil motions" />
  <title>Supreme Court E-Filing Portal — Motion Form</title>
</head>
<body>
  <h1>Civil Motion Filing</h1>
  <form>
    <p>
      <label for="portal_password">Portal password</label>
      <input id="portal_password" name="portal_password" type="password" autocomplete="off" />
    </p>
    <p>
      <label for="case_number">Case number</label>
      <input id="case_number" name="case_number" placeholder="Case number" />
    </p>
    <p>
      <label for="plaintiff">Plaintiff</label>
      <input id="plaintiff" name="plaintiff" placeholder="Plaintiff" />
    </p>
    <p>
      <label for="defendant">Defendant</label>
      <input id="defendant" name="defendant" placeholder="Defendant" />
    </p>
    <p>
      <label for="statement_of_facts">Statement of Facts (motion text)</label>
      <textarea id="statement_of_facts" name="statement_of_facts" rows="6" cols="60" placeholder="Statement of Facts"></textarea>
    </p>
  </form>
</body>
</html>
